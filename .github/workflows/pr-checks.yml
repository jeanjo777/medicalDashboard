name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest

    steps:
      - name: PR Info
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            core.summary
              .addHeading(`PR #${pr.number}: ${pr.title}`)
              .addRaw(`**Author:** @${pr.user.login}`)
              .addEOL()
              .addRaw(`**Branch:** \`${pr.head.ref}\` → \`${pr.base.ref}\``)
              .addEOL()
              .addRaw(`**Changed files:** ${pr.changed_files}`)
              .addEOL()
              .addRaw(`**Additions:** +${pr.additions} | **Deletions:** -${pr.deletions}`)
              .write();

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for console.logs
        run: |
          if grep -r "console\.log" src/ --include="*.ts" --include="*.tsx" | grep -v "logger"; then
            echo "::warning::Found console.log statements. Please use the logger utility instead."
            exit 0
          fi

      - name: Check for TODO comments
        run: |
          todos=$(grep -r "TODO\|FIXME" src/ --include="*.ts" --include="*.tsx" || true)
          if [ -n "$todos" ]; then
            echo "## 📝 TODO Comments Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$todos" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check file sizes
        run: |
          echo "## 📦 Large Files Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          find src -type f -size +50k | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "⚠️ Large file: \`$file\` ($size)" >> $GITHUB_STEP_SUMMARY
          done

  build-preview:
    name: Build Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 3

      - name: Comment PR with preview
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Build Ready\n\nYour build preview is ready! [Download artifacts](${artifactUrl})\n\n**Build stats:**\n- ✅ Build successful\n- 📦 Artifacts available for 3 days`
            });

  changed-files:
    name: Changed Files Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v42

      - name: List changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          echo "## 📝 Changed Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for file in ${ALL_CHANGED_FILES}; do
            echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
          done

      - name: Check for sensitive files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          sensitive_files=".env .env.local .env.production package-lock.json"
          found_sensitive=false

          for file in ${ALL_CHANGED_FILES}; do
            for sensitive in $sensitive_files; do
              if [[ "$file" == *"$sensitive"* ]]; then
                echo "::warning::Sensitive file changed: $file"
                found_sensitive=true
              fi
            done
          done

          if [ "$found_sensitive" = true ]; then
            echo "## ⚠️ Sensitive Files Changed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review changes to sensitive files carefully." >> $GITHUB_STEP_SUMMARY
          fi
