name: Performance Testing

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Serve build
        run: |
          npm install -g serve
          serve -s dist -l 3000 &
          sleep 5

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with analysis
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Analyze bundle
        run: |
          echo "## 📊 Bundle Analysis Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Total bundle size
          total_js=$(find dist/assets -name "*.js" -exec du -cb {} + | tail -1 | cut -f1)
          total_css=$(find dist/assets -name "*.css" -exec du -cb {} + | tail -1 | cut -f1)

          total_js_mb=$(echo "scale=2; $total_js / 1024 / 1024" | bc)
          total_css_mb=$(echo "scale=2; $total_css / 1024 / 1024" | bc)

          echo "### Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript: ${total_js_mb}MB" >> $GITHUB_STEP_SUMMARY
          echo "- CSS: ${total_css_mb}MB" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Largest files
          echo "### Top 10 Largest Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY

          find dist/assets -type f \( -name "*.js" -o -name "*.css" \) -exec du -h {} + | \
            sort -rh | head -10 | while read size file; do
            filename=$(basename "$file")
            echo "| $filename | $size |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Check performance budget
        run: |
          total_size=$(du -sb dist/assets | cut -f1)
          max_size=$((5 * 1024 * 1024)) # 5MB budget

          if [ $total_size -gt $max_size ]; then
            echo "::error::Bundle size exceeds performance budget!"
            echo "Current: $(echo "scale=2; $total_size / 1024 / 1024" | bc)MB"
            echo "Budget: $(echo "scale=2; $max_size / 1024 / 1024" | bc)MB"
            exit 1
          else
            echo "✅ Performance budget check passed"
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
