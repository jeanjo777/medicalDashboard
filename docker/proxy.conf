# Main proxy - routes subdomains to apps
# Add new server blocks here for additional apps

resolver 127.0.0.11 valid=10s;

# medical.simpliceake.com → MediCare Pro
server {
    listen 80;
    server_name medical.simpliceake.com;

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# simpliceake.com / www → landing page (future)
server {
    listen 80;
    server_name simpliceake.com www.simpliceake.com;

    location / {
        # Redirect to medical for now
        return 302 http://medical.simpliceake.com$request_uri;
    }
}

# Catch-all for direct IP access
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
