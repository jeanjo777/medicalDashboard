services:
  # Nginx Reverse Proxy (multi-app + SSL)
  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/proxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

  # PostgreSQL Database (shared across apps)
  db:
    image: postgres:16-alpine
    container_name: medicare-db
    environment:
      POSTGRES_DB: medicare
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/roles.sql:/docker-entrypoint-initdb.d/00-roles.sql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare -d medicare"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgREST - REST API (Supabase compatible)
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: medicare-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://medicare:${DB_PASSWORD_ENCODED}@db:5432/medicare
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    restart: unless-stopped

  # MediCare Pro - Frontend App
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: https://medical.simpliceake.com
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
        VITE_N8N_WEBHOOK_URL: ${VITE_N8N_WEBHOOK_URL:-}
    container_name: medicare-app
    depends_on:
      - postgrest
    restart: unless-stopped

volumes:
  pgdata:
