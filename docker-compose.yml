services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: medicare-db
    environment:
      POSTGRES_DB: medicare
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - medicare-pgdata-v2:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare -d medicare"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgREST - REST API (Supabase compatible)
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: medicare-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://medicare:${DB_PASSWORD_ENCODED}@db:5432/medicare
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    restart: unless-stopped

  # MediCare Pro - Frontend + Nginx reverse proxy
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: http://${VPS_HOST:-localhost}
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
        VITE_N8N_WEBHOOK_URL: ${VITE_N8N_WEBHOOK_URL:-}
    container_name: medicare-app
    ports:
      - "80:80"
    depends_on:
      - postgrest
    restart: unless-stopped

volumes:
  medicare-pgdata-v2:
