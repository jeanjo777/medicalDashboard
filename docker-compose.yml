services:
  # PostgreSQL Database (custom image with init SQL baked in)
  db:
    build:
      context: ./docker
      dockerfile: Dockerfile.db
    container_name: medicare-db
    environment:
      POSTGRES_DB: medicare
      POSTGRES_USER: medicare
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - medicare-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicare -d medicare"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgREST - REST API (Supabase compatible)
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: medicare-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://medicare:${DB_PASSWORD_ENCODED}@db:5432/medicare
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    restart: unless-stopped

  # Edge Functions service (auth, patients, etc.)
  functions:
    build:
      context: ./docker
      dockerfile: Dockerfile.functions
    container_name: medicare-functions
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    restart: unless-stopped

  # MediCare Pro - Frontend + Nginx API proxy
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: https://medical.simpliceake.com
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
        VITE_N8N_WEBHOOK_URL: ${VITE_N8N_WEBHOOK_URL:-}
    container_name: medicare-app
    depends_on:
      - postgrest
      - functions
    restart: unless-stopped

  # Caddy - HTTPS reverse proxy (auto Let's Encrypt)
  caddy:
    build:
      context: ./docker
      dockerfile: Dockerfile.proxy
    container_name: medicare-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  medicare-data-v2:
  caddy-data:
  caddy-config:
